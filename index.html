<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شجرة العائلة التفاعلية</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #1a1a1a; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            overflow: hidden; 
            display: flex; 
            flex-direction: row;
            height: 100vh;
            width: 100vw;
        }
        #tree { 
            flex: 1; 
            height: 100%; 
            cursor: grab; 
            touch-action: none;
        }
        #sidebar { 
            width: 320px; 
            background: #242424; 
            border-right: 1px solid #333; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            box-shadow: -2px 0 10px rgba(0,0,0,0.5); 
            z-index: 10;
            overflow-y: auto;
        }
        h3 { margin: 0; color: #00ffcc; font-size: 18px; }
        #lineage-box { 
            background: #121212; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            font-size: 14px; 
            line-height: 1.6; 
            max-height: 220px; 
            overflow-y: auto; 
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button { 
            background: #333; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 10px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 14px;
            transition: 0.2s; 
        }
        button:hover { background: #00ffcc; color: #121212; border-color: #00ffcc; }
        .btn-danger:hover { background: #ff4444; color: #fff; border-color: #ff4444; }
        .node circle { fill: #242424; stroke: #00ffcc; stroke-width: 2.5px; cursor: pointer; }
        .node circle.has-children { fill: #00ffcc; }
        .node text { font-size: 13px; fill: #e0e0e0; cursor: pointer; }
        .node text:hover { fill: #00ffcc; font-weight: bold; }
        .link { fill: none; stroke: #444; stroke-width: 1.5px; }

        /* التجاوب مع شاشات التابلت والهواتف */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            #tree {
                height: 55vh;
                width: 100%;
            }
            #sidebar {
                width: 100%;
                height: 45vh;
                border-right: none;
                border-top: 1px solid #333;
                padding: 15px;
                gap: 10px;
            }
            #lineage-box {
                max-height: 90px;
                font-size: 13px;
                padding: 8px;
            }
            .btn-group {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            button {
                padding: 8px;
                font-size: 13px;
            }
            hr { display: none; }
        }
    </style>
</head>
<body>
    <div id="tree"></div>
    <div id="sidebar">
        <h3 id="selected-name">اختر اسماً من الشجرة</h3>
        <div id="lineage-box">انقر على أي اسم لعرض سلسلة النسب كاملة هنا...</div>
        <div class="btn-group">
            <button onclick="expandAll()">توسيع الكل</button>
            <button onclick="copyLineage()">نسخ النسب</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
